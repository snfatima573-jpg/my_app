<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الأول</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f4ff;
            padding: 50px 15px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>مرحبا بك في تطبيقي!</h1>
        <p>هذا أول تطبيق ويب أقوم بإنشائه.</p>
        <button onclick="alert('أهلا بك!')">
            اضغط هنا
        </button>
    </div>
</body>
</html>
